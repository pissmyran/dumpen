# The documentation site, built with Zensical and published on GitHub Pages
# by .github/workflows/pages.yml. Build it locally with
#   node tools/docs-site.mjs && zensical build
# tools/docs-site.mjs assembles site-docs/ from README.md, docker/README.md and
# docs/; edit those, never site-docs/ or site/.
[project]
site_name = "Dumpen"
site_description = "Image archive for app icons and themes on Cloudflare R2, with ZIP import and a theme library."
repo_url = "https://github.com/pissmyran/dumpen"
repo_name = "pissmyran/dumpen"
docs_dir = "site-docs"
site_dir = "site"
nav = [
  { "Home" = "index.md" },
  { "Docker" = "docker.md" },
  { "Source on GitHub" = "https://github.com/pissmyran/dumpen#readme" },
]

[project.theme]
language = "en"
font = false
features = [
  "content.code.copy",
  "content.tooltips",
  "navigation.footer",
  "navigation.instant",
  "navigation.instant.prefetch",
  "navigation.path",
  "navigation.sections",
  "navigation.top",
  "navigation.tracking",
  "search.highlight",
  "toc.follow",
]

[project.theme.icon]
logo = "lucide/images"
repo = "fontawesome/brands/github"

[[project.theme.palette]]
media = "(prefers-color-scheme)"
toggle.icon = "lucide/sun-moon"
toggle.name = "Switch to light mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: light)"
scheme = "default"
primary = "deep-orange"
accent = "deep-orange"
toggle.icon = "lucide/sun"
toggle.name = "Switch to dark mode"

[[project.theme.palette]]
media = "(prefers-color-scheme: dark)"
scheme = "slate"
primary = "deep-orange"
accent = "deep-orange"
toggle.icon = "lucide/moon"
toggle.name = "Follow the system setting"

[[project.extra.social]]
icon = "fontawesome/brands/github"
link = "https://github.com/pissmyran/dumpen#readme"
name = "Source on GitHub"

[project.markdown_extensions]
abbr = {}
admonition = {}
attr_list = {}
def_list = {}
footnotes = {}
md_in_html = {}
tables = {}
toc.permalink = true
toc.slugify = { object = "pymdownx.slugs.slugify", kwds = { case = "lower" } }
pymdownx.betterem = {}
pymdownx.details = {}
pymdownx.highlight.anchor_linenums = true
pymdownx.highlight.pygments_lang_class = true
pymdownx.inlinehilite = {}
pymdownx.keys = {}
pymdownx.superfences.custom_fences = [
  { name = "mermaid", class = "mermaid", format = "pymdownx.superfences.fence_code_format" },
]
pymdownx.tabbed.alternate_style = true
pymdownx.tasklist.custom_checkbox = true
