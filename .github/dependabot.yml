# One grouped pull request a month for all dependencies in this repo. Security
# updates still arrive at once, as separate pull requests. Dependabot is exempt
# from the release size check.
version: 2

multi-ecosystem-groups:
  monthly:
    schedule:
      interval: monthly
    labels: ["dependencies"]

updates:
  - package-ecosystem: npm
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: monthly
  - package-ecosystem: docker
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: monthly
  - package-ecosystem: github-actions
    directory: "/"
    patterns: ["*"]
    multi-ecosystem-group: monthly
