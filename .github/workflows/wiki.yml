# Mirrors the documentation (README.md, docker/README.md and docs/, assembled by
# tools/docs-site.mjs --wiki) one way into the repo's GitHub wiki on every push
# to main. Edits made in the wiki are overwritten; change the repo instead. The
# wiki's git repo exists only once its first page has been created on GitHub.
name: Wiki

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: wiki
  cancel-in-progress: false

jobs:
  wiki:
    name: Spegla
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          repository: ${{ github.repository }}.wiki
          path: .wiki
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: node
      - run: node tools/docs-site.mjs --wiki "$RUNNER_TEMP/wiki"
      - name: Skriv över wikin
        working-directory: .wiki
        run: |
          find . -mindepth 1 -maxdepth 1 ! -name .git -exec rm -rf {} +
          cp -r "$RUNNER_TEMP/wiki/." .
          git config user.name "github-actions[bot]"
          git config user.email "41898268+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Speglad från ${GITHUB_SHA::7}"
          git push
