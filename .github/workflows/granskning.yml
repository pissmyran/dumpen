# Granskar varje pull request till main med Claude och lämnar en review som
# granskningskontot: godkänner, eller begär ändringar med kommentarer på
# raderna. Granskningskontot är kodägare, så inget mergas utan dess
# godkännande; det är godkännandet som är grinden, inte det här jobbet.
#
# Körs som pull_request_target: workflowet och skriptet kommer alltid från
# main, aldrig från PR:en, så en PR kan inte ändra sin egen granskning.
# Jobbet läser bara diffen via API:t och kör aldrig koden i PR:en.
# Hemligheterna ligger i miljön granskning, som bara main får använda.
#
# PR:er från forks granskas inte. Postolle skickar dem till repots agent,
# som gör om ändringen på dev.
#
# Ändringar under .github/ godkänns bara automatiskt från Renovate; andra
# får etiketten agaren-godkanner och väntar på ägaren.
name: Granskning

on:
  pull_request_target:
    branches: [main]
    types: [opened, synchronize, reopened, ready_for_review]

permissions: {}

concurrency:
  group: granskning-${{ github.event.pull_request.number }}
  cancel-in-progress: true

jobs:
  granska:
    name: Granskning
    if: >-
      github.event.pull_request.head.repo.full_name == github.repository &&
      !github.event.pull_request.draft
    runs-on: ubuntu-latest
    timeout-minutes: 20
    environment: granskning
    permissions:
      contents: read
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.pull_request.base.sha }}
          persist-credentials: false
          sparse-checkout: |
            .github/granskning
            CLAUDE.md
          sparse-checkout-cone-mode: false

      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: node

      - name: Installera Claude Code
        run: npm install --global @anthropic-ai/claude-code@latest

      - name: Granska
        env:
          CLAUDE_CODE_OAUTH_TOKEN: ${{ secrets.CLAUDE_CODE_OAUTH_TOKEN }}
          GRANSKARE_TOKEN: ${{ secrets.GRANSKARE_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          PR: ${{ github.event.pull_request.number }}
          SHA: ${{ github.event.pull_request.head.sha }}
        run: bash .github/granskning/granska.sh
