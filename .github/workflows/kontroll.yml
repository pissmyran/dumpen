# Kontrollerar repots workflows (actionlint), skript (shellcheck) och
# JSON-filer (jq) på varje PR, i merge queue och en gång i veckan. Verktygen
# installeras i senaste version. Finns katalogen .github/kontroll.d körs
# varje skript där också, t.ex. stubbtesterna i organisationens .github-repo.
#
# Shellcheck stoppar på nivån i SHELLCHECK_NIVA nedan (error, warning, info
# eller style). Höj den när repots skript är rättade.
name: Kontroll

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  merge_group:
  schedule:
    - cron: "41 3 * * 1"
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: kontroll-${{ github.ref }}
  cancel-in-progress: true

jobs:
  kontroll:
    name: Kontroll
    runs-on: ubuntu-latest
    timeout-minutes: 10
    env:
      SHELLCHECK_NIVA: error
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - name: Verktyg
        run: |
          pipx install actionlint-py
          pipx install shellcheck-py
          echo "$HOME/.local/bin" >> "$GITHUB_PATH"
      - name: Workflows
        run: actionlint -color
      - name: Skript
        run: git ls-files -z '*.sh' | xargs -0 -r shellcheck -S "$SHELLCHECK_NIVA"
      - name: JSON
        run: |
          fel=0
          while IFS= read -r -d '' fil; do
            jq empty "$fil" 2>/dev/null || { echo "::error file=$fil::Ogiltig JSON"; fel=1; }
          done < <(git ls-files -z '*.json')
          exit "$fel"
      - name: Repots egna kontroller
        run: |
          [ -d .github/kontroll.d ] || exit 0
          for skript in .github/kontroll.d/*.sh; do
            echo "== $skript"
            bash "$skript"
          done
