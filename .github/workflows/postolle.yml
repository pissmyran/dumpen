# Postolle bär lappar till repots agent: misslyckade workflows, begärda
# ändringar, PR:er från forks, PR:er ur merge queue, nya issues och merge
# till main. Lappen startar agentens rutin i Claude Code direkt; agenten
# pollar aldrig. Varje timme blir säkerhetslarm issues med etiketten
# security, tilldelade ägaren, och de stängs när larmet är åtgärdat.
# Nya issues och PR:er tilldelas ägaren.
#
# Skriptet hämtas alltid från main.
#
# Repots variabel ROUTINE_URL och hemlighet ROUTINE_TOKEN pekar på agentens
# rutin. LARM_TOKEN (ägarens token som läser larmen) ligger i miljön larm.
name: Postolle

on:
  workflow_run:
    workflows: ["**", "!Postolle", "!Larm", "!Granskning"]
    types: [completed]
  pull_request_review:
    types: [submitted]
  pull_request_target:
    types: [opened, reopened, dequeued]
  issues:
    types: [opened, reopened]
  push:
    branches: [main]
  schedule:
    - cron: "17 * * * *"
  workflow_dispatch:

permissions: {}

concurrency:
  group: postolle-${{ github.event_name }}-${{ github.event.workflow_run.id || github.event.pull_request.number || github.event.issue.number || github.ref }}
  cancel-in-progress: false

jobs:
  lapp:
    name: Lapp
    if: >-
      github.event_name != 'schedule' && github.event_name != 'workflow_dispatch' &&
      (github.event_name != 'pull_request_review' || github.event.review.state == 'changes_requested')
    runs-on: ubuntu-latest
    timeout-minutes: 5
    permissions:
      actions: read
      contents: read
      issues: write
      pull-requests: write
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.event.repository.default_branch }}
          persist-credentials: false
          sparse-checkout: .github/postolle
      - name: Skicka lappen
        env:
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AGARE: VineDrinker
          ROUTINE_URL: ${{ vars.ROUTINE_URL }}
          ROUTINE_TOKEN: ${{ secrets.ROUTINE_TOKEN }}
        run: bash .github/postolle/postolle.sh

  larm:
    name: Säkerhetslarm
    if: github.event_name == 'schedule' || github.event_name == 'workflow_dispatch'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    environment: larm
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
          sparse-checkout: .github/postolle
      - name: Larm till issues
        env:
          LARM_TOKEN: ${{ secrets.LARM_TOKEN }}
          GH_TOKEN: ${{ github.token }}
          REPO: ${{ github.repository }}
          AGARE: VineDrinker
        run: bash .github/postolle/postolle.sh
