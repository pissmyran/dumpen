# Dumpen – self-hosted image gallery. Fill in the values below, then run:
#   docker compose up -d
# The gallery answers on port 8787. Images under /bilder/ are public; everything
# else needs a login.
#
# Two ways to log in (AUTH_MODE):
#   password           – fill in ADMIN_PASSWORD. Nothing else is needed.
#   cloudflare-access  – Cloudflare Access in front of the site:
#                        1. Zero Trust → Networks → Tunnels: create a tunnel, point a public
#                           host name at http://dumpen:8787 and put its token in TUNNEL_TOKEN.
#                        2. Zero Trust → Access → Applications: add a self-hosted app for that
#                           host name with a policy for who may log in.
#                        3. Copy the app's "Application Audience (AUD) Tag" to CF_ACCESS_AUD
#                           and your team domain to CF_ACCESS_TEAM_DOMAIN.
#                        4. Start with the tunnel: docker compose --profile tunnel up -d
services:
  dumpen:
    image: docker.io/driftaegis/dumpen:2
    restart: unless-stopped
    ports:
      - "8787:8787"
    environment:
      # Address the gallery is reached on; image links are built from it.
      PUBLIC_URL: "https://dumpen.example.com"
      AUTH_MODE: "password" # or "cloudflare-access"
      # AUTH_MODE=password
      ADMIN_PASSWORD: "change-me-to-a-long-password"
      # AUTH_MODE=cloudflare-access
      CF_ACCESS_TEAM_DOMAIN: "" # e.g. yourteam.cloudflareaccess.com
      CF_ACCESS_AUD: ""
      # Optional: set App Launcher icons from a theme (Cloudflare Access only).
      # API token with "Access: Apps and Policies: Edit".
      WORKERS_API_TOKEN: ""
      CLOUDFLARE_ACCOUNT_ID: ""
    volumes:
      - dumpen-data:/data # the images (local R2)

  tunnel:
    image: docker.io/cloudflare/cloudflared:latest
    profiles: ["tunnel"]
    restart: unless-stopped
    command: tunnel --no-autoupdate run
    environment:
      TUNNEL_TOKEN: "" # from Zero Trust → Networks → Tunnels
    depends_on:
      - dumpen

volumes:
  dumpen-data:
