# yaml-language-server: $schema=https://coderabbit.ai/integrations/schema.v2.json
# Inherit shared settings from pissmyran/coderabbit.
# Keep only repository-specific settings here.

inheritance: true

reviews:
  path_instructions:
    - path: "{src/index.js,tests/worker.test.js}"
      instructions: |
        When routing or authentication changes, check that only
        image reads with GET and HEAD under /bilder/ are public, besides
        the intended login and logout routes of password mode.
        The API and static portal pages must require a verified Access JWT or
        a valid password session with an explicit AUTH_MODE=password.
        Check JWT signature, issuer, audience and expiry.
        A broken Access configuration must never open access.
        LOCAL_DEV may only bypass the check on localhost or 127.0.0.1.
        Check session signature, expiry and cookie attributes.
        Mutations must keep sameOriginRequest where that guard is used.

        When R2 operations change, check the bucket choice, allowed
        keys and the isolation between gallery/, imported/ and legacy.
        Direct import must keep the original and never overwrite an existing
        destination. Check the ETag for changed source objects and concurrent
        attempts; a check before writing does not guarantee this on its own.
        Deletion must be limited to the intended selection and keep each
        endpoint's confirmation requirement. Check pagination and partial failures.
        PNG uploads must validate the actual bytes, size and resolution.
        Dimension scans must use metadata or cache before a bounded
        range read. The cache identity must separate source, key and ETag.

        When the App Launcher integration changes, check that apply
        compares the client's preview with a fresh server-computed plan.
        Check the app's current logo_url before updating.
        themeRequest must keep the affected app settings and policy links.
        Check the verification after PUT and the reporting of partial failures.
        A timeout after a possible update must never be shown as a verified
        absence of change. Check both the string token and Secrets Store.
        When tests change, check that the R2 double and fetch stubs can
        reproduce the failure scenario at hand, not just successful operations.

    - path: "public/{zip-import,zip-ui}.js"
      instructions: |
        When ZIP reading changes, check the limits for archive size,
        entry count, image size and total uncompressed data.
        Also check the actual decompressed size during extraction,
        not only the size fields in the ZIP directory. Keep the ZIP decoder's
        bounded output buffer in zip-ui.js.
        Check safe paths, offset bounds, local file headers,
        compression method, CRC and PNG dimensions.
        Archive paths must never become arbitrary R2 keys; every image must go
        through /api/upload and the server's validation.
        When the upload loop changes, check that saved rows
        are not sent again on retry and that an interruption is not reported as
        a confirmed failure to store. Check tests/zip-import.test.js
        for the affected parser cases and theme and variant export/import.

    - path: "public/{app,r2-ui,theme-ui,theme-library}.js"
      instructions: |
        When moving or cataloging changes, check that the new
        image is saved before the original is deleted. Legacy originals must be kept
        on import; deleting the imported/ source must happen only after successful
        cataloging. Check that partial failures are not shown as full success.
        When the R2 view changes, check that late responses from a previous
        source never replace the current selection and that mutations use the right
        source, key and ETag. Keep the guard against duplicate running actions.
        When theme deletion changes, check that the right theme name is confirmed.
        When the App Launcher view changes, check that a changed theme or
        resolution invalidates an earlier preview and that apply
        sends the change plan that was shown and reports failed apps.
        When ZIP export changes, check that app, theme, variant and
        resolution survive re-import through zip-import.js.

    - path: "{src/index.js,public/**}"
      instructions: |
        AGENTS.md explicitly requires a Swedish application interface.
        This is an exception to the inherited English-string rule:
        preserve Swedish user-facing interface text unless the task explicitly
        changes the interface language.
        Keep code comments and developer documentation in English.
        Do not report Swedish interface text as a language defect.

    - path: "{build.mjs,public/manifest.json,wrangler.jsonc}"
      instructions: |
        When the Worker build or static assets change, check
        that public/manifest.json contains the assets and module imports
        the portal needs in the self-contained dist/worker.js.
        Check that build.mjs still finds exactly one fetch entry
        and injects the intended production values without opening authentication.
        Check how no_bundle, the embedded ASSETS and the Worker entry work together.
        The production configuration must never introduce LOCAL_DEV or switch
        to password mode by mistake. Check the R2 and Secrets Store bindings
        against src/index.js and the placeholders declared in cloudflare.example.env.

    - path: "{tools/render.mjs,cloudflare.example.env}"
      instructions: |
        When rendering or placeholders change, check that every
        placeholder in use is declared in cloudflare.example.env and that
        missing values stop the rendering.
        Separate a missing value from an intentionally empty one.
        Check that values with quotes or line breaks never break
        JavaScript, JSON or shell files where they are inserted.
        Check that removing the output directory can never delete
        the source tree or value files and that copying never becomes recursive.
        Check links and the overlay so private files are never read
        or changed by mistake. Secret values must never end up in public/
        or in the embedded asset manifest.

    - path: "{Dockerfile,docker-compose.yml,docker/*.sh,docker/wrangler.jsonc,package.json}"
      instructions: |
        When container start or upgrades change, check
        Node, Wrangler and workerd together with entrypoint.sh.
        Keep running as non-root and the required write access.
        Wrangler must use local R2 with --persist-to /data; a restart or
        image change must never wipe images or saved settings.
        Check the required values for both AUTH_MODE modes and that
        local use does not need a Cloudflare account for image storage.
        When settings import changes, check that NAME=value is read
        as data, never executed as shell code. Keep the precedence of
        non-empty environment variables and removal through an empty import value.
        Check private file permissions and that the import file is not removed
        before the settings are saved. Secrets must never be built into the image.
        Check that rendered sources and all runtime assets are included.

    - path: ".github/workflows/{release,docker}.yml"
      instructions: |
        When the release flow changes, check the link between the
        package.json version, the v tag, CHANGELOG.md and the published image.
        A merge without a version change must not create a new release.
        Check that docker.yml can publish both from a tag and
        through workflow_call from release.yml without losing the version check.
        Check that release secrets are only used in the publishing step
        and that a rerun after a partial publish never tags the wrong image as
        the version, minor, major or latest tag.
        These are review checks, not permission to edit owner-managed workflows.

knowledge_base:
  code_guidelines:
    filePatterns:
      - "**/AGENTS.md"
      - "pissmyran/.github:GOVERNANCE.md"
      - "pissmyran/.github:SERVICES.md"

  linked_repositories:
    - repository: pissmyran/jobb
      instructions: |
        Compare changes to the shared service tooling conventions:
        placeholders, tools/render.mjs, Docker startup, settings import,
        and documentation-site generation.
        Report concrete compatibility differences, not unrelated application behavior.

    - repository: pissmyran/klarsprak
      instructions: |
        Compare changes to the shared service tooling conventions:
        placeholders, tools/render.mjs, Docker startup, settings import,
        and documentation-site generation.
        Report concrete compatibility differences, not unrelated application behavior.

    - repository: pissmyran/politiker
      instructions: |
        Compare changes to the shared service tooling conventions:
        placeholders, tools/render.mjs, Docker startup, settings import,
        and documentation-site generation.
        Report concrete compatibility differences, not unrelated application behavior.
