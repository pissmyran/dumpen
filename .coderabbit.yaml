# yaml-language-server: $schema=https://www.coderabbit.ai/integrations/schema.v2.json
# CodeRabbit reviews pull requests (mostly from outside contributors; the maintainer pushes
# straight to main) and is run locally with the `cr` CLI before each push.
language: "sv-SE"
tone_instructions: "Kort och saklig. Ta bara upp det som spelar roll för korrekthet, säkerhet, integritet och kostnad. Inga artighetsfraser."
reviews:
  profile: chill
  high_level_summary: true
  sequence_diagrams: false
  estimate_code_review_effort: false
  in_progress_fortune: false
  poem: false
  suggested_reviewers: false
  auto_apply_labels: true
  labeling_instructions:
    - label: bug
      instructions: "Fixes or reports something that does not work as intended."
    - label: enhancement
      instructions: "Adds a feature or improves existing behaviour."
    - label: security
      instructions: "Fixes or reports a vulnerability, a leaked secret or unsafe handling of user data."
    - label: dependencies
      instructions: "Only updates dependencies or base images."
    - label: docker
      instructions: "Changes the Docker image, docker-compose.yml or docker/."
    - label: ci
      instructions: "Changes GitHub workflows or repository tooling."
    - label: documentation
      instructions: "Only changes documentation."
  slop_detection:
    enabled: true
    label: slop
  auto_review:
    enabled: true
    drafts: false
  path_filters:
    - "!**/*.min.js"
    - "!**/live-schema.sql"
    - "!**/worker-configuration.d.ts"
  path_instructions:
    - path: "**/*"
      instructions: "The repo is public and generic. Flag any real domain, account or resource id, e-mail address, name, key, token, donation link or payment detail; only __NAME__ placeholders declared in cloudflare.example.env, or example.com/.example/.test values, are allowed. Flag contact lists or other data embedded in code: data belongs outside the repo. Flag work that rescans a whole bucket, table or site on every request, cron run or added item. Workers target the Free plan (10 ms CPU)."
    - path: ".github/workflows/**"
      instructions: "Only GitHub-owned actions, pinned by full commit SHA. Permissions read-only unless a job truly needs more. Never pull_request_target, never secrets in pull_request jobs, never larger runners or anything billable."
    - path: "tools/render.mjs"
      instructions: "Must stay generic: fails on a missing declared value, never writes values into the repo, never copies the output directory into itself."
    - path: "**/Dockerfile"
      instructions: "Images must start empty and work with zero setup. No personal values, no secrets baked in, run as a non-root user, keep layers small."
    - path: "docker/**"
      instructions: "POSIX sh, set -eu. Settings come from the container environment or once from /data/import.env via import-settings.sh. docker/README.md is the Docker Hub page and must match docker-compose.yml and CHANGELOG.md."
    - path: "**/*.test.*"
      instructions: "Tests must not depend on formatting and must use example values only."
    - path: "src/**"
      instructions: "Only /bilder/* is public; every other path needs the Cloudflare Access JWT or, with AUTH_MODE=password, the session cookie. R2 scans stay incremental (metadata at write time, edge cache, one range read per object version)."
    - path: "public/**"
      instructions: "Plain browser JavaScript modules, no build step and no third-party CDN."
  tools:
    languagetool:
      enabled: false
    markdownlint:
      enabled: false
    biome:
      enabled: false
    stylelint:
      enabled: false
chat:
  art: false
  allow_non_org_members: false
knowledge_base:
  code_guidelines:
    enabled: true
    filePatterns:
      - "CLAUDE.md"
      - "AGENTS.md"
      - "docs/**/*.md"
issue_enrichment:
  labeling:
    auto_apply_labels: true
    labeling_instructions:
      - label: bug
        instructions: "Reports something that does not work as intended."
      - label: enhancement
        instructions: "Asks for a new feature or an improvement."
      - label: security
        instructions: "Reports a vulnerability, a leaked secret or unsafe handling of user data."
      - label: dependencies
        instructions: "Is about dependencies or base images, for example asking for an update."
      - label: docker
        instructions: "Is about the Docker image, docker-compose.yml or running in Docker."
      - label: ci
        instructions: "Is about GitHub workflows or repository tooling."
      - label: documentation
        instructions: "Is about the documentation: missing, wrong or unclear."
